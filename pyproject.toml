[project]
name = "deployeval"
version = "0.1.0"
description = "Does an AI coding agent ship a working, secure app on AWS free tier for $0? An open, re-runnable benchmark measuring the gap between 'the agent said done' and 'it actually works'."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Shivam Kalkar" }]
keywords = ["llm", "agent", "evals", "benchmark", "aws", "deployment", "security"]
dependencies = [
    "requests>=2.31",
    "boto3>=1.34",
    "pyyaml>=6.0",
    "websocket-client>=1.7",   # realtime-room probes only
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
deployeval = "deployeval.run_all:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deployeval = ["allowlist.yaml"]

[tool.ruff]
line-length = 110
